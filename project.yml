name: GolfSwing
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
schemes:
  GolfSwing:
    build:
      targets:
        GolfSwing: all
targets:
  GolfSwing:
    type: application
    platform: iOS
    sources: [GolfSwing]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.golfswing
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "The camera records your swing and measures your mobility."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Audio is recorded with swing videos."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Import swing videos and grip photos from your library."
